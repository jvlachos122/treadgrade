name: Refresh NHTSA data

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: treadgrade-pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch
      - run: npm run validate:data
      - run: npm test
      - run: npm run build
      - run: npm run check:links
      - run: npm run check:html
      - name: Commit refreshed data
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ratings.json data/plants.json data/meta.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh NHTSA tire ratings and plant codes"
            git push origin HEAD:main
          fi
      - name: Write IndexNow manifest
        if: github.ref == 'refs/heads/main'
        run: node scripts/indexnow.mjs --write-manifest .indexnow/manifest.json
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: indexnow-manifest
          path: .indexnow/manifest.json
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous IndexNow manifest
        uses: actions/cache@v4
        with:
          path: .indexnow/previous-manifest.json
          key: indexnow-manifest-${{ github.run_id }}
          restore-keys: |
            indexnow-manifest-
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-manifest
          path: .indexnow
      - name: Submit changed URLs to IndexNow
        run: |
          node scripts/indexnow.mjs --submit \
            --manifest .indexnow/manifest.json \
            --previous .indexnow/previous-manifest.json
          cp .indexnow/manifest.json .indexnow/previous-manifest.json
